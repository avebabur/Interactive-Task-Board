<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Kanban Lite: a simple task board to organise tasks into To Do, In Progress and Completed."
        />
        <title>KanBan Lite</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <!--Header-->
        <header>
            <h1>Kanban Lite</h1>

            <button type="button" id="theme-toggle" aria-pressed="false">
                Dark mode
            </button>

            <!--Adds to To Do by default-->
            <button type="button" id="new-task-btn">+ New task</button>
        </header>

        <main>
            <!--Search and filter bar-->
            <section id="filters" aria-label="Search and filter tasks">
                <label for="search-input">Search</label>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search by title"
                />

                <label for="category-filter">Category</label>
                <select id="category-filter">
                    <option value="all">All categories</option>
                    <option value="development">Development</option>
                    <option value="design">Design</option>
                    <option value="marketing">Marketing</option>
                </select>
            </section>

            <!--Board with three columns, each + adds a task to its own column-->
            <section id="board" aria-label="Task board">
                <section
                    class="column"
                    data-status="todo"
                    aria-labelledby="todo-heading"
                >
                    <h2 id="todo-heading">To Do</h2>
                    <button
                        type="button"
                        class="add-to-column"
                        data-status="todo"
                        aria-label="Add task to To Do"
                    >
                        +
                    </button>
                    <ul class="task-list" id="todo-list"></ul>
                </section>

                <section
                    class="column"
                    data-status="in-progress"
                    aria-labelledby="in-progress-heading"
                >
                    <h2 id="in-progress-heading">In Progress</h2>
                    <button
                        type="button"
                        class="add-to-column"
                        data-status="in-progress"
                        aria-label="Add task to In Progress"
                    >
                        +
                    </button>
                    <ul class="task-list" id="in-progress-list"></ul>
                </section>

                <section
                    class="column"
                    data-status="completed"
                    aria-labelledby="completed-heading"
                >
                    <h2 id="completed-heading">Completed</h2>
                    <button
                        type="button"
                        class="add-to-column"
                        data-status="completed"
                        aria-label="Add task to Completed"
                    >
                        +
                    </button>
                    <ul class="task-list" id="completed-list"></ul>
                </section>
            </section>
        </main>

        <!--Add task popup, script.js opens it-->
        <dialog id="task-dialog" aria-labelledby="task-form-heading">
            <form id="task-form">
                <h2 id="task-form-heading">New task</h2>

                <label for="task-title">Title</label>
                <input
                    type="text"
                    id="task-title"
                    name="title"
                    required
                    maxlength="80"
                />

                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    name="description"
                    rows="3"
                    maxlength="300"
                ></textarea>

                <label for="task-category">Category</label>
                <select id="task-category" name="category">
                    <option value="development">Development</option>
                    <option value="design">Design</option>
                    <option value="marketing">Marketing</option>
                </select>

                <label for="task-priority">Priority</label>
                <select id="task-priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>

                <!--Column + buttons select their own column here-->
                <label for="task-status">Column</label>
                <select id="task-status" name="status">
                    <option value="todo" selected>To Do</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>

                <button type="button" id="cancel-task-btn">Cancel</button>
                <button type="submit">Add task</button>
            </form>
        </dialog>

        <script src="script.js"></script>
    </body>
</html>
